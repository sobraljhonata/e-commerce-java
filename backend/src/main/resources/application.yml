spring:
  application:
    name: wave1-backend

# Alinha emissor (JwtAccessTokenIssuer) e validação (resource server) — sobrescrever via env em produção.
platform:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-32b-min!!}
      expires-in-seconds: ${JWT_EXPIRES_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
